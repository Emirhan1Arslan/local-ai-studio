[project]
name = "studio-mcp"
version = "0.1.0"
description = "Local AI Studio — MCP server (stdio + streamable HTTP), REST /v1 üzerinden çalışır"
requires-python = ">=3.11"
# Bilinçli olarak studio-core'a bağımlı DEĞİL: bu paket tek başına, Studio'nun
# çalışmadığı bir istemci makinesine kurulup uzaktaki Studio'ya köprü olabilir.
dependencies = ["mcp>=2.2", "httpx>=0.27"]

[project.scripts]
studio-mcp = "studio_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio_mcp"]
