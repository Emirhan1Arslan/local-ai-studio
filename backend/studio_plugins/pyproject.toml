[project]
name = "studio-plugins"
version = "0.1.0"
description = "Local AI Studio — Plugin runtime, manifest, izinler, imza (Faz 13)"
requires-python = ">=3.11"
dependencies = ["studio-core"]

[tool.uv.sources]
studio-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio_plugins"]
