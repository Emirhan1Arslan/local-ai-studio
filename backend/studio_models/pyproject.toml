[project]
name = "studio-models"
version = "0.1.0"
description = "Local AI Studio — Model Manager + Download Manager (Faz 2)"
requires-python = ">=3.11"
dependencies = [
    "studio-core",
    "watchdog>=4.0",
]

[tool.uv.sources]
studio-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio_models"]
