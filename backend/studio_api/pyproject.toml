[project]
name = "studio-api"
version = "0.1.0"
description = "Local AI Studio — FastAPI: REST /v1 + WebSocket olay veriyolu"
requires-python = ">=3.11"
dependencies = [
    "studio-core",
    "studio-models",
    "studio-inference",
    "studio-workflows",
    "studio-mcp",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
studio-api = "studio_api.main:main"

[tool.uv.sources]
studio-core = { workspace = true }
studio-models = { workspace = true }
studio-inference = { workspace = true }
studio-workflows = { workspace = true }
studio-mcp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio_api"]
