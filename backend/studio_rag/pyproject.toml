[project]
name = "studio-rag"
version = "0.1.0"
description = "Local AI Studio — Embeddings, vektör deposu, ingest (Faz 6)"
requires-python = ">=3.11"
dependencies = ["studio-core"]

[tool.uv.sources]
studio-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio_rag"]
