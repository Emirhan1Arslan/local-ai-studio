[project]
name = "local-ai-studio"
version = "0.1.0"
description = "Local AI Studio — yerel AI orchestration platformu (monorepo kökü)"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["backend/*", "sdk/python"]

[tool.uv.sources]
studio-core = { workspace = true }
studio-api = { workspace = true }

[dependency-groups]
dev = [
    "studio-api",
    "studio-core",
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    # adapter'ın saf-PIL yardımcılarını (outpaint tuvali) test etmek için
    "pillow>=10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic'in ürettiği migration'lar elle biçimlendirilmez
"backend/studio_core/alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
